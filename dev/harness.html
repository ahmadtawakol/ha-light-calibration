<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Light Calibration — frontend harness</title>
<style>
/* Home Assistant's own custom properties, near enough to judge layout by.
   The real values come from the active HA theme. */
:root {
  --primary-color: #03a9f4;
  --text-primary-color: #fff;
  --primary-background-color: #f2f4f7;
  --card-background-color: #fff;
  --primary-text-color: #212121;
  --secondary-text-color: #727272;
  --divider-color: #e0e0e0;
  --secondary-background-color: #e8eaed;
  --app-header-background-color: #03a9f4;
  --app-header-text-color: #fff;
  --ha-card-border-radius: 12px;
  --ha-card-box-shadow: 0 2px 6px rgba(0, 0, 0, .12);
  --warning-color: #ffa726;
  font-family: Roboto, system-ui, sans-serif;
}
:root.dark {
  --primary-background-color: #111417;
  --card-background-color: #1c1f24;
  --primary-text-color: #e1e1e1;
  --secondary-text-color: #9b9b9b;
  --divider-color: #2c2f34;
  --secondary-background-color: #24272c;
  --app-header-background-color: #1c1f24;
}
body { margin: 0; background: var(--primary-background-color); }
#mount { padding-bottom: 190px; }
#panelbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 99999;
  background: #16181d; color: #d8dce3; font: 12px/1.5 ui-monospace, Menlo, monospace;
  border-top: 2px solid #3a3f4a; max-height: 180px; display: flex;
}
#states { padding: 8px; display: flex; flex-wrap: wrap; gap: 5px; align-content: flex-start;
          flex: 1; border-right: 1px solid #3a3f4a; overflow: auto; }
#states button { font: 11px ui-monospace, Menlo, monospace; padding: 4px 8px; cursor: pointer;
                 background: #262a31; color: #d8dce3; border: 1px solid #3a3f4a; border-radius: 4px; }
#states button:hover { background: #333842; }
#states button.on { background: var(--primary-color); border-color: var(--primary-color); color: #fff; }
#states .sep { flex-basis: 100%; height: 0; }
#states .label { color: #767c88; padding: 2px 0; flex-basis: 100%; }
#log { flex: 1; padding: 8px; overflow: auto; }
#log .head { color: #767c88; }
#log div.call { color: #7fd88f; white-space: pre-wrap; }
</style>
</head>
<body>
<div id="mount"></div>
<div id="panelbar"><div id="states"></div><div id="log"><div class="head">service calls</div></div></div>

<script type="module">
/* The real module, straight out of the component -- never a copy, because a
   stale copy is exactly the bug this project's content-addressed URL exists to
   prevent. In Home Assistant that URL carries a hash of the file, so it can
   never go stale; here there is no hash, so the cache is busted by hand.
   Without this you edit the component, reload, and study the old interface. */
const bust = "?t=" + Date.now();
// One module, awaited in order: the harness builds a <light-calibration-panel>
// immediately, so the component has to have defined it first. Two separate
// module scripts do not reliably give that ordering.
await import(
  "../custom_components/light_calibration/www/light-calibration-card.js" + bust
);
await import("./harness.js" + bust);
</script>
</body>
</html>
