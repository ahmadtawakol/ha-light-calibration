<!doctype html><html><body style="background:#f2f2f2">
<lc-test></lc-test>
<div id="out" style="font:12px monospace;white-space:pre"></div>
<script>
const CSS = `
.lc-tile{position:relative;box-sizing:border-box;display:flex;flex-direction:column;
 background:var(--ha-card-background,var(--card-background-color,#fff));
 border-radius:var(--ha-card-border-radius,var(--ha-border-radius-lg,12px));
 border:var(--ha-card-border-width,1px) solid var(--ha-card-border-color,var(--divider-color,#e0e0e0));
 box-shadow:var(--ha-card-box-shadow,none);color:var(--primary-text-color,#212121);
 font-family:var(--ha-font-family-body,Roboto,Noto,sans-serif);
 --lc-color:var(--state-inactive-color,var(--grey-color,#9e9e9e));
 transition:box-shadow 180ms ease-in-out,border-color 180ms ease-in-out;}
.lc-tile .lc-bg{position:absolute;top:0;left:0;right:0;bottom:0;padding:0;border:none;background:none;font:inherit;color:inherit;cursor:pointer;overflow:hidden;
 border-radius:var(--ha-card-border-radius,var(--ha-border-radius-lg,12px));
 margin:calc(-1 * var(--ha-card-border-width,1px));-webkit-tap-highlight-color:transparent;}
.lc-tile .lc-bg::before{content:"";position:absolute;inset:0;background-color:var(--lc-color);opacity:0;}
.lc-tile .lc-bg:hover::before{opacity:.04}
.lc-tile .lc-bg:active::before{opacity:.12}
.lc-tile:has(.lc-bg:focus-visible){border-color:var(--lc-color);
 box-shadow:var(--ha-card-box-shadow,0 0 0 0 transparent),0 0 0 1px var(--lc-color);}
.lc-tile .lc-row{position:relative;display:flex;align-items:center;gap:10px;padding:0 10px;min-height:var(--row-height,56px);min-width:0;box-sizing:border-box;pointer-events:none}
.lc-tile .lc-badge{position:relative;flex:none;width:36px;height:36px;border-radius:var(--ha-border-radius-pill,9999px);display:flex;align-items:center;justify-content:center;overflow:hidden;color:var(--lc-color)}
.lc-tile .lc-badge::before{content:"";position:absolute;top:0;left:0;width:100%;height:100%;background-color:currentColor;opacity:.2}
.lc-tile .lc-badge svg{position:relative;display:block;width:24px;height:24px;fill:currentColor}
.lc-tile .lc-bg:hover ~ .lc-row .lc-badge::before{opacity:.35}
.lc-tile .lc-bg:active ~ .lc-row .lc-badge{transform:scale(1.2)}
.lc-tile .lc-info{display:flex;flex-direction:column;align-items:flex-start;justify-content:center;width:100%;min-width:0;gap:0}
.lc-tile .lc-name{width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:var(--ha-font-size-m,14px);font-weight:var(--ha-font-weight-medium,500);line-height:var(--ha-line-height-normal,1.6);letter-spacing:.1px;color:var(--primary-text-color,#212121)}
.lc-tile .lc-state{width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:var(--ha-font-size-s,12px);font-weight:var(--ha-font-weight-normal,400);line-height:var(--ha-line-height-condensed,1.2);letter-spacing:.4px;color:var(--primary-text-color,#212121)}
.lc-tile .lc-state.lc-warn{color:var(--warning-color,#ffa600)}
.lc-tile .lc-features{position:relative;padding:0 12px 12px 12px;display:grid;grid-template-columns:minmax(0,1fr);gap:12px;pointer-events:none}
.lc-tile .lc-features > *{pointer-events:auto}
.lc-tile .lc-features > *[hidden]{display:none}
.lc-tile .lc-switch{position:relative;display:flex;width:100%;height:42px;padding:0;border:none;background:none;font:inherit;color:var(--lc-color);cursor:pointer;overflow:hidden;box-sizing:border-box;border-radius:var(--ha-card-features-border-radius,var(--ha-border-radius-lg,12px));-webkit-tap-highlight-color:transparent}
.lc-tile .lc-switch .lc-track{position:absolute;inset:0;border-radius:inherit;background-color:currentColor;opacity:.2}
.lc-tile .lc-switch:hover .lc-track,.lc-tile .lc-switch:focus-visible .lc-track{opacity:.4}
.lc-tile .lc-switch .lc-thumb{position:relative;width:50%;height:100%;border-radius:inherit;background-color:currentColor;display:flex;align-items:center;justify-content:center;transition:transform 180ms ease-in-out}
.lc-tile .lc-switch[aria-checked="true"] .lc-thumb{transform:translateX(100%)}
.lc-tile .lc-switch[aria-checked="true"] .lc-thumb:dir(rtl){transform:translateX(-100%)}
.lc-tile .lc-switch .lc-thumb svg{width:20px;height:20px;fill:#fff;display:block}
.lc-tile .lc-switch:focus{outline:none}
.lc-tile .lc-switch:focus-visible{box-shadow:0 0 0 2px currentColor}
.lc-tile .lc-action{position:relative;width:100%;height:42px;padding:0 12px;border:none;cursor:pointer;overflow:hidden;box-sizing:border-box;border-radius:var(--ha-card-features-border-radius,var(--ha-border-radius-lg,12px));background:none;color:var(--primary-text-color,#212121);font-family:inherit;font-size:var(--ha-font-size-m,14px);font-weight:var(--ha-font-weight-medium,500)}
.lc-tile .lc-action::before{content:"";position:absolute;inset:0;border-radius:inherit;background-color:var(--lc-color);opacity:.2}
.lc-tile .lc-action:hover::before{opacity:.4}
.lc-tile .lc-action > span{position:relative}
`;
const BULB="M12,2A7,7 0 0,0 5,9C5,11.38 6.19,13.47 8,14.74V17A1,1 0 0,0 9,18H15A1,1 0 0,0 16,17V14.74C17.81,13.47 19,11.38 19,9A7,7 0 0,0 12,2M9,21A1,1 0 0,0 10,22H14A1,1 0 0,0 15,21V20H9V21Z";
const EYE="M6.92,19L5,17.08L13.06,9L15,10.94M20.71,5.63L18.37,3.29C18,2.9 17.35,2.9 16.96,3.29L13.84,6.41L11.91,4.5L10.5,5.91L11.92,7.33L3,16.25V21H7.75L16.67,12.08L18.09,13.5L19.5,12.09L17.58,10.17L20.7,7.05C21.1,6.65 21.1,6 20.71,5.63Z";
customElements.define("lc-test", class extends HTMLElement{
 connectedCallback(){
  this.attachShadow({mode:"open"});
  const s=document.createElement("style"); s.textContent=CSS;
  const w=document.createElement("div"); w.style.cssText="display:grid;gap:16px;padding:20px;max-width:340px";
  w.innerHTML=`
  <div class="lc-tile" id="t1" style="--lc-color: #ffa757">
   <button class="lc-bg" type="button" aria-label="Lamp, calibration details"></button>
   <div class="lc-row">
    <span class="lc-badge"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="${BULB}"/></svg></span>
    <span class="lc-info"><span class="lc-name">Living Room Light Stand That Is Long</span>
    <span class="lc-state lc-warn">On &middot; 62% &middot; correction off</span></span>
   </div>
   <div class="lc-features">
    <button class="lc-switch" id="sw" type="button" role="switch" aria-checked="true" aria-label="Calibration correction" title="on">
      <span class="lc-track"></span><span class="lc-thumb"><svg viewBox="0 0 24 24"><path d="${EYE}"/></svg></span>
    </button>
    <button class="lc-action" type="button" hidden><span>Calibrate</span></button>
   </div>
  </div>
  <div class="lc-tile" id="t2" style="--lc-color: var(--state-light-off-color, var(--state-light-inactive-color, var(--state-inactive-color, #9e9e9e)))">
   <button class="lc-bg" type="button"></button>
   <div class="lc-row"><span class="lc-badge"><svg viewBox="0 0 24 24"><path d="${BULB}"/></svg></span>
   <span class="lc-info"><span class="lc-name">Bookcase Light Bars</span><span class="lc-state">Off &middot; not calibrated</span></span></div>
   <div class="lc-features">
    <button class="lc-switch" type="button" role="switch" aria-checked="false" hidden><span class="lc-track"></span><span class="lc-thumb"></span></button>
    <button class="lc-action" type="button"><span>Calibrate</span></button>
   </div>
  </div>`;
  this.shadowRoot.append(s,w);
 }
});
addEventListener("load",()=>{
 const r=document.querySelector("lc-test").shadowRoot;
 const L=[];
 const t1=r.getElementById("t1");
 // 1. does the focus-ring box-shadow declaration survive parsing?
 const sheet=r.styleSheets[0];
 for(const rule of sheet.cssRules){
   if(rule.selectorText && rule.selectorText.includes(":has")){
     L.push("FOCUS RULE selector: "+rule.selectorText);
     L.push("  box-shadow parsed as: ["+rule.style.boxShadow+"]");
     L.push("  border-color parsed as: ["+rule.style.borderColor+"]");
   }
 }
 // 2. simulate a theme that sets --ha-card-box-shadow: none (HA default themes do)
 document.documentElement.style.setProperty("--ha-card-box-shadow","none");
 t1.querySelector(".lc-bg").focus();
 L.push("with --ha-card-box-shadow:none -> computed box-shadow on focused tile = ["+getComputedStyle(t1).boxShadow+"]");
 document.documentElement.style.removeProperty("--ha-card-box-shadow");
 t1.querySelector(".lc-bg").focus();
 L.push("with token unset            -> computed box-shadow on focused tile = ["+getComputedStyle(t1).boxShadow+"]");
 // 3. host display
 L.push("host display = "+getComputedStyle(document.querySelector("lc-test")).display);
 // 4. hit test: what is at the center of the name text?
 const name=r.querySelector("#t1 .lc-name").getBoundingClientRect();
 const hit=r.elementFromPoint(name.left+20,name.top+name.height/2);
 L.push("elementFromPoint over name = "+(hit?hit.className||hit.tagName:"null"));
 const swr=r.getElementById("sw").getBoundingClientRect();
 L.push("elementFromPoint over switch = "+(()=>{const e=r.elementFromPoint(swr.left+swr.width/2,swr.top+swr.height/2);return e?e.className||e.tagName:"null"})());
 // 5. lc-bg geometry vs tile
 const bg=r.querySelector("#t1 .lc-bg").getBoundingClientRect(), tr=t1.getBoundingClientRect();
 L.push("tile rect  "+[tr.x,tr.y,tr.width,tr.height].map(n=>n.toFixed(1)).join(","));
 L.push("lc-bg rect "+[bg.x,bg.y,bg.width,bg.height].map(n=>n.toFixed(1)).join(","));
 // 6. hidden switch on t2
 const t2sw=r.querySelector("#t2 .lc-switch");
 L.push("hidden .lc-switch display = "+getComputedStyle(t2sw).display);
 // 7. :dir support
 L.push("CSS.supports selector(:dir(rtl)) = "+CSS.supports("selector(:dir(rtl))"));
 L.push("CSS.supports selector(:has(a)) = "+CSS.supports("selector(:has(a))"));
 // 8. thumb transform
 L.push("thumb transform = "+getComputedStyle(r.querySelector("#t1 .lc-thumb")).transform);
 // 9. row height / name overflow
 L.push("row height = "+r.querySelector("#t1 .lc-row").getBoundingClientRect().height);
 const n=r.querySelector("#t1 .lc-name"); L.push("name scrollW/clientW = "+n.scrollWidth+"/"+n.clientWidth+" (ellipsis ok if >)");
 // 10. color-mix
 L.push("color-mix supported = "+CSS.supports("background","color-mix(in srgb, var(--x, #ff0000) 20%, transparent)"));
 document.getElementById("out").textContent=L.join("\n");
});
</script></body></html>
